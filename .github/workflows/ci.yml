name: Swift Package CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      redis:
        image: redis:8.2.8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.2.4"
          skip-verify-signature: true
      - name: Test package
        env:
          REDIS_INTEGRATION_URL: redis://127.0.0.1:6379
        run: swift test -Xswiftc -warnings-as-errors
